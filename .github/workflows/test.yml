name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (offline, no network required)
        run: python -m unittest discover -s tests -t . -v
      - name: Run offline demo
        run: PYTHONPATH=src python -m ssb.cli demo
      - name: Run offline compare and sweep
        run: |
          PYTHONPATH=src python -m ssb.cli generate --offline --limit 10 --max-per-class 1 --out /tmp/ssb-bench.json
          PYTHONPATH=src python -m ssb.cli compare /tmp/ssb-bench.json --a exact --b baseline
          PYTHONPATH=src python -m ssb.cli sweep /tmp/ssb-bench.json --from-threshold 0.7 --to-threshold 0.95 --step 0.05

